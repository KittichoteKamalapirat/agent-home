<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vlog overlay</title>
<style>
  /* Transparent 1920x1080 overlay for a talking-head video. Every frame is a pure function of output time: seek(t).
     Copy this folder into the edit folder, then replace the SCENES block with this video's graphics.
     Take colours, fonts and logo from the project's own design guide; the tokens below are neutral placeholders. */
  :root { --ink: #1c1f1c; --muted: #646a63; --wash: rgba(0,0,0,.05); --accent: #64cb3c; --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
          --side-x: 1150px; /* left edge of the free side of the frame: where the speaker is not */ }
  *, *::before, *::after { box-sizing: border-box; transition: none !important; animation: none !important; }
  html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: transparent; font-family: var(--font); color: var(--ink); }
  p, h3, ol { margin: 0; padding: 0; list-style: none; }

  /* Card */
  .panel { position: absolute; left: var(--side-x); width: 660px; top: 50%; padding: 44px 48px; border-radius: 32px; background: #fff;
           box-shadow: 0 2px 6px rgba(0,0,0,.14), 0 30px 70px rgba(0,0,0,.28); opacity: 0; }
  .panel .kicker { margin-bottom: 14px; color: var(--muted); font-size: 26px; font-weight: 600; }
  .panel h3 { font-size: 58px; font-weight: 650; letter-spacing: -.03em; line-height: 1.05; }
  .panel .big { font-size: 170px; font-weight: 650; letter-spacing: -.05em; line-height: .95; font-variant-numeric: tabular-nums; }
  .panel li { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 22px; margin-top: 18px; padding: 22px 26px; border-radius: 20px;
              background: var(--wash); font-size: 34px; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; }
  .panel li i { display: grid; place-items: center; width: 62px; height: 62px; border-radius: 50%; background: var(--ink); color: #fff; font-style: normal; font-size: 30px; }

  /* Phone showing real recordings of the app */
  .stage { position: absolute; left: calc(var(--side-x) + 140px); top: 92px; width: 240px; transform-origin: 0 0; opacity: 0; }
  .phone { position: relative; width: 240px; aspect-ratio: 240 / 518; border-radius: 46px; background: #0b0b0b; box-shadow: 0 2px 6px rgba(0,0,0,.2), 0 30px 60px rgba(0,0,0,.35); }
  .screen { position: absolute; inset: 9px; border-radius: 37px; overflow: hidden; background: #fff; }
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; background: #fff; }

  /* Small label next to the phone */
  .chip { position: absolute; padding: 14px 26px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.16), 0 14px 34px rgba(0,0,0,.26);
          font-size: 28px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; opacity: 0; }
  .chip.dark { background: #111; color: #fff; }

  /* Subtitles: last in the document, above everything */
  #sub { position: absolute; z-index: 100; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center; }
  #sub span { display: none; max-width: 1500px; padding: 12px 28px 14px; border-radius: 18px; background: rgba(12,12,12,.82); color: #fff;
              font-size: 46px; font-weight: 600; line-height: 1.2; text-align: center; white-space: nowrap; }
</style>
</head>
<body>

<!-- SCENES: example graphics. Each one keys off a cue name from edit.json and is skipped when that cue does not exist. -->
<div class="panel" id="hook">
  <p class="kicker">Every single day</p>
  <h3>The question the video opens with</h3>
</div>

<div class="stage" id="stage"><div class="phone"><div class="screen">
  <canvas id="cv-a" width="600" height="1304"></canvas>
  <canvas id="cv-b" width="600" height="1304"></canvas>
</div></div></div>
<div class="chip dark" id="soon" style="left: calc(var(--side-x) - 60px); top: 560px">Coming soon</div>

<div id="sub"><span></span></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const cl = (x) => Math.max(0, Math.min(1, x));
const p = (t, a, b) => cl((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 4);          // ease out: for things arriving
const ei = (x) => x * x * x;                       // ease in: for things leaving
const back = (x) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
let T, C;
const REC = {};                                    // name -> decoded frames of an app recording, 30 per second
const RECORDINGS = {};                             // e.g. { plan: 120 }: folder under /rec/ and its frame count (001.jpg ...)
const PHONE_SCALE = 1.7;

// A card that slides in from the side at `a` and leaves by `b`. Returns true while it is on screen.
function panel(el, t, a, b) {
  const k = eo(p(t, a, a + 0.5)), o = ei(p(t, b - 0.3, b));
  el.style.opacity = cl(p(t, a, a + 0.18)) * (1 - o);
  el.style.transform = `translate(${(1 - k) * 90 + o * 60}px, -50%)`;
  return t >= a && t < b;
}
function rise(el, t, a, { dy = 26, dur = 0.4 } = {}) { const k = eo(p(t, a, a + dur)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`; }
function pop(el, t, a) { const x = p(t, a, a + 0.34); el.style.opacity = cl(x * 3); el.style.transform = `scale(${0.7 + 0.3 * back(x)})`; }
function chip(el, t, a, b) {
  const x = p(t, a, a + 0.36), o = ei(p(t, b - 0.25, b));
  el.style.opacity = cl(x * 3) * (1 - o); el.style.transform = `translateX(${(1 - eo(x)) * 40}px) scale(${0.9 + 0.1 * back(x)})`;
}
// The phone rises in at `a` and drops out by `b`.
function phone(t, a, b) {
  const stage = $("#stage"), on = t >= a - 0.05 && t < b;
  if (!on) { stage.style.opacity = 0; return false; }
  const k = eo(p(t, a, a + 0.6)), o = ei(p(t, b - 0.32, b));
  stage.style.opacity = cl(p(t, a, a + 0.2)) * (1 - o);
  stage.style.transform = `translateY(${(1 - k) * 240 + o * 200}px) scale(${PHONE_SCALE})`;
  return true;
}
// Draw second `seconds` of recording `name` on a phone canvas.
function draw(canvas, name, seconds, loop = false) {
  const f = REC[name]; let i = Math.floor(seconds * 30);
  i = loop ? ((i % f.length) + f.length) % f.length : Math.max(0, Math.min(f.length - 1, i));
  canvas.getContext("2d").drawImage(f[i], 0, 0, canvas.width, canvas.height);
}
// A second screen slides over the first at `at`.
const slide = (el, t, at) => { el.style.transform = `translateX(${(1 - eo(p(t, at, at + 0.42))) * 101}%)`; };

function seek(t) {
  const span = $("#sub span"), cur = T.subs.find((s) => t >= s.start && t < s.end);
  span.style.display = cur ? "block" : "none";
  if (cur) span.textContent = cur.text;

  // SCENES: replace with this video's graphics. Start each one on the cue for the word it illustrates.
  if (C.hook !== undefined) panel($("#hook"), t, C.hook, C.hook_out ?? C.hook + 6);
  if (C.app !== undefined && REC.plan && phone(t, C.app, C.app_out ?? C.app + 10)) {
    draw($("#cv-a"), "plan", t - C.app, true);
    $("#cv-b").style.transform = "translateX(101%)";
  } else $("#stage").style.opacity = 0;
  if (C.soon !== undefined) chip($("#soon"), t, C.soon, C.soon_out ?? C.soon + 4);

  return new Promise((done) => requestAnimationFrame(() => requestAnimationFrame(done)));
}

window.ready = (async () => {
  T = await (await fetch("/timeline.json")).json(); C = T.cues;
  const load = (src) => new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => bad(new Error(src)); im.src = src; });
  for (const [name, count] of Object.entries(RECORDINGS))
    REC[name] = await Promise.all(Array.from({ length: count }, (_, i) => load(`/rec/${name}/${String(i + 1).padStart(3, "0")}.jpg`)));
  await Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
  await document.fonts.ready;
  await seek(0);
  return T.total;
})();
</script>
</body>
</html>

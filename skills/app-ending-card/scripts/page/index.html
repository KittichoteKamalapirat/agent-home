<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App ending card</title>
<style>
  /* 1080x1920 transparent ending for a short vertical video. Every frame is a pure function of time: seek(t).
     Part 1 sits over the video's final shot: a card shows the taps that send this video to the app, then the saved item.
     Part 2 covers the frame: app name, store badge, web address.
     All content comes from /card.json (see SKILL.md); timings from timing.json; the taps per platform from platforms.json. ?p=<platform>
     When card.json has "ingredients", the saved item opens into a grid of up to 8 ingredient icons before part 2, using timing.json's "ingredients" times. */
  :root { --ink: #20241f; --muted: #60655e; --quiet: #767b74; --accent: #64cb3c; --accent-text: #285b32; --tile: #f2f2f2; }
  *, *::before, *::after { box-sizing: border-box; transition: none !important; animation: none !important; }
  html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  p { margin: 0; }
  .card { position: absolute; left: 70px; top: 980px; width: 860px; padding: 44px 48px 48px; border-radius: 56px; background: #fff; color: var(--ink);
          box-shadow: 0 4px 14px rgba(0,0,0,.16), 0 40px 90px rgba(0,0,0,.28); transform-origin: 50% 100%; }
  .head { display: flex; align-items: center; gap: 18px; font-weight: 650; font-size: 54px; letter-spacing: -.03em; line-height: 1.1; white-space: nowrap; }
  .head img { height: 66px; width: auto; transform-origin: 50% 100%; }
  .body { position: relative; height: 236px; margin-top: 34px; }
  .state { position: absolute; inset: 0; }
  .hint { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 34px; font-weight: 500; letter-spacing: -.01em; line-height: 1; }
  .hint img { width: 38px; height: 38px; }
  .steps { display: grid; grid-template-columns: 1fr 40px 1fr 40px 1fr; align-items: start; margin-top: 26px; }
  .steps .chev { height: 124px; display: grid; place-items: center; }
  .steps .chev svg { width: 34px; height: 34px; fill: none; stroke: var(--quiet); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .app { display: grid; justify-items: center; gap: 12px; font-size: 27px; font-weight: 600; line-height: 1; }
  .app i { display: grid; place-items: center; width: 124px; height: 124px; border-radius: 31px; background: var(--tile); }
  .app svg { width: 56px; height: 56px; fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; }
  .app circle { fill: var(--muted); stroke: none; }
  .app i.dark { background: #111; } .app i.dark svg { stroke: none; fill: #fff; }
  .app i.blue { background: #3478f6; } .app i.blue circle { fill: #fff; }
  #tile img { height: 72px; width: auto; }
  .saved { display: grid; grid-template-columns: 236px 1fr; align-items: center; gap: 36px; }
  .saved img { width: 236px; height: 236px; border-radius: 40px; object-fit: cover; }
  .saved b { display: block; font-size: 58px; font-weight: 650; letter-spacing: -.03em; line-height: 1.08; }
  .saved span { display: inline-flex; align-items: center; gap: 12px; margin-top: 18px; color: var(--accent-text); font-size: 38px; font-weight: 600; line-height: 1; }
  .saved svg { width: 44px; height: 44px; }
  .tap { position: absolute; z-index: 5; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: rgba(17,17,17,.24); box-shadow: 0 0 0 4px rgba(255,255,255,.9); opacity: 0; }
  #outro { position: absolute; inset: 0; background: #fff; display: none; }
  #outro .lockup { position: absolute; left: 0; right: 0; top: 690px; display: flex; align-items: center; justify-content: center; gap: 30px; color: var(--ink); font-weight: 650; font-size: 150px; letter-spacing: -.03em; line-height: 1; }
  #outro .lockup img { height: 176px; width: auto; transform-origin: 50% 100%; }
  #outro .store { position: absolute; left: 0; right: 0; top: 930px; display: flex; justify-content: center; }
  #outro .store img { width: 470px; height: auto; }
  #outro .url { position: absolute; left: 0; right: 0; top: 1130px; text-align: center; color: var(--muted); font-size: 68px; font-weight: 550; letter-spacing: -.01em; line-height: 1; }
  #ing { overflow: hidden; height: 0; }
  #ingin { display: flow-root; }
  #ing .ihead { display: flex; align-items: baseline; justify-content: space-between; margin-top: 40px; padding-top: 34px; border-top: 2px solid #eceeea; }
  #ing .ihead b { font-size: 44px; font-weight: 650; letter-spacing: -.02em; }
  #ing .ihead span { color: var(--muted); font-size: 34px; font-weight: 550; }
  #ing .grid { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 26px; margin-top: 30px; }
  #ing .tile { display: grid; justify-items: center; gap: 6px; text-align: center; }
  #ing .tile i { display: grid; place-items: center; width: 150px; height: 150px; border-radius: 38px; background: #f4f5f3; }
  #ing .tile img { width: 124px; height: 124px; object-fit: contain; }
  #ing .tile b { margin-top: 6px; font-size: 29px; font-weight: 600; line-height: 1.05; letter-spacing: -.01em; }
  #ing .tile small { font-size: 26px; font-weight: 500; color: var(--muted); line-height: 1; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head"><img id="logo" alt=""><span id="headline"></span></div>
  <div class="body">
    <div class="state" id="a">
      <p class="hint"><img id="brand" alt=""><span id="where"></span></p>
      <div class="steps">
        <span class="app"><i id="s1"></i><b id="l1"></b></span>
        <span class="chev"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
        <span class="app"><i id="s2"></i><b id="l2"></b></span>
        <span class="chev"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
        <span class="app"><i id="tile"><img id="tile-logo" alt=""></i><b id="l3"></b></span>
      </div>
    </div>
    <div class="state saved" id="b">
      <img id="item" alt="">
      <div><b id="name"></b><span id="ok"><svg viewBox="0 0 24 24"><circle id="ok-dot" cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#20241f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><em id="saved" style="font-style:normal"></em></span></div>
    </div>
  </div>
  <div id="ing"><div id="ingin">
    <div class="ihead"><b id="ing-title"></b><span id="count"></span></div>
    <div class="grid" id="grid"></div>
  </div></div>
  <span class="tap" id="tap"></span>
</div>
<div id="outro">
  <div class="lockup" data-in><img id="out-logo" alt=""><span id="out-name"></span></div>
  <div class="store" data-in><img id="badge" alt=""></div>
  <p class="url" data-in id="url"></p>
</div>
<script>
const $ = (s) => document.querySelector(s);
const cl = (x) => Math.max(0, Math.min(1, x));
const p = (t, a, b) => cl((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 4);
const back = (x) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// Simple drawings of each platform's own buttons, not copies of their artwork.
const ICON = {
  send: '<svg viewBox="0 0 24 24"><path d="M21 3 3 10l7 3 3 7 8-17zM10 13l5-5" stroke-linejoin="round"/></svg>',
  shareto: '<svg viewBox="0 0 24 24"><path d="M12 15V4M8 7.5l4-4 4 4M7 11H5.5A1.5 1.5 0 0 0 4 12.5v6A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5v-6a1.5 1.5 0 0 0-1.5-1.5H17" stroke-linejoin="round"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M13.5 5l7 6.5-7 6.5v-4c-5 0-8 1.5-10 5 0-6 3.5-10 10-10V5z" stroke-linejoin="round"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg>',
};
let TAPS, SWAP, OUT, GROW = null, ingH = 0, spots, logoAt;

function seek(t) {
  const k = eo(p(t, 0, 0.36)), leave = p(t, OUT, OUT + 0.2);
  $("#card").style.opacity = cl(p(t, 0, 0.14)) * (1 - leave);
  $("#card").style.transform = `translateY(${(1 - k) * 150}px) scale(${0.94 + 0.06 * k})`;

  // finger: taps the three steps in turn; the tapped step keeps a ring until the next tap
  const n = t < TAPS[1] - 0.25 ? 0 : t < TAPS[2] - 0.25 ? 1 : 2, T = TAPS[n], from = n ? spots[n - 1] : { x: spots[0].x + 70, y: spots[0].y + 90 };
  const a = eo(p(t, T - 0.25, T)), press = Math.sin(p(t, T, T + 0.2) * Math.PI);
  const tap = $("#tap");
  tap.style.left = from.x + (spots[n].x - from.x) * a + "px"; tap.style.top = from.y + (spots[n].y - from.y) * a + "px";
  tap.style.opacity = cl(p(t, TAPS[0] - 0.25, TAPS[0] - 0.1)) * (1 - p(t, TAPS[2] + 0.14, TAPS[2] + 0.3));
  tap.style.transform = `scale(${1 - 0.25 * press})`;
  ["#s1", "#s2", "#tile"].forEach((id, i) => {
    const on = t >= TAPS[i] && (i === 2 || t < TAPS[i + 1]);
    $(id).style.boxShadow = on ? "0 0 0 6px #fff, 0 0 0 12px var(--accent)" : "none";
    $(id).style.transform = `scale(${1 - 0.07 * Math.sin(p(t, TAPS[i], TAPS[i] + 0.2) * Math.PI)})`;
  });

  // steps give way to the saved item; the logo hops when it lands
  const out = p(t, SWAP, SWAP + 0.16), inn = eo(p(t, SWAP + 0.1, SWAP + 0.42));
  $("#a").style.opacity = 1 - out; $("#a").style.transform = `translateY(${-out * 22}px)`;
  $("#b").style.opacity = cl(p(t, SWAP + 0.1, SWAP + 0.26)); $("#b").style.transform = `translateY(${(1 - inn) * 36}px)`;
  const pop = p(t, SWAP + 0.3, SWAP + 0.62);
  $("#ok").style.opacity = cl(pop * 3); $("#ok").style.transform = `scale(${0.7 + 0.3 * back(pop)})`; $("#ok").style.transformOrigin = "0 50%";
  const h = p(t, SWAP + 0.28, SWAP + 0.6), q = Math.sin(p(t, SWAP + 0.6, SWAP + 0.74) * Math.PI);
  $("#logo").style.transform = `translateY(${-30 * 4 * h * (1 - h)}px) scale(${1 + 0.14 * q}, ${1 - 0.16 * q})`;

  // ingredients variant: the saved item opens upward into the ingredients pulled from the video
  if (GROW !== null) {
    $("#ing").style.height = eo(p(t, GROW, GROW + 0.4)) * ingH + "px";
    [...document.querySelectorAll("#ing .tile")].forEach((el, i) => {
      const e = p(t, GROW + 0.25 + i * 0.09, GROW + 0.55 + i * 0.09);
      el.style.opacity = cl(e * 2.5); el.style.transform = `scale(${0.6 + 0.4 * back(e)})`;
    });
    $("#count").style.opacity = cl(p(t, GROW + 0.3, GROW + 0.5));
  }

  // ending: white grows out of the card's logo and covers the frame
  const o = $("#outro"); o.style.display = t >= OUT ? "block" : "none";
  if (t >= OUT) {
    if (t < OUT + 0.02) { const lr = $("#logo").getBoundingClientRect(); logoAt = { x: lr.left + lr.width / 2, y: lr.top + lr.height / 2 }; }
    o.style.clipPath = `circle(${eo(p(t, OUT, OUT + 0.5)) * 2300}px at ${logoAt.x}px ${logoAt.y}px)`;
    [...o.querySelectorAll("[data-in]")].forEach((el, i) => {
      const e = eo(p(t, OUT + 0.3 + i * 0.1, OUT + 0.72 + i * 0.1));
      el.style.opacity = e; el.style.transform = `translateY(${(1 - e) * 34}px)`;
    });
    const J = OUT + 0.62, h2 = p(t, J, J + 0.36), q2 = Math.sin(p(t, J + 0.36, J + 0.5) * Math.PI);
    $("#out-logo").style.transform = `translateY(${-70 * 4 * h2 * (1 - h2)}px) scale(${1 + 0.14 * q2}, ${1 - 0.16 * q2})`;
  }
  return new Promise((done) => requestAnimationFrame(() => requestAnimationFrame(done)));
}

window.ready = (async () => {
  const get = async (u) => (await fetch(u)).json();
  const [card, timing, platforms] = await Promise.all([get("/card.json"), get("timing.json"), get("platforms.json")]);
  ({ taps: TAPS, swap: SWAP, out: OUT } = timing);
  let end = timing.end;
  if (card.ingredients) ({ grow: GROW, out: OUT, end } = timing.ingredients);
  const key = new URLSearchParams(location.search).get("p") ?? "instagram", pf = platforms[key];
  if (!pf) throw new Error("unknown platform " + key);
  const asset = (f) => "/work/" + f;
  if (card.accent) { document.documentElement.style.setProperty("--accent", card.accent); document.documentElement.style.setProperty("--accent-text", card.accentText ?? card.accent); }
  $("#ok-dot").setAttribute("fill", card.accent ?? "#64cb3c");
  for (const id of ["#logo", "#tile-logo", "#out-logo"]) $(id).src = asset(card.logo);
  $("#headline").textContent = card.headline;
  $("#where").textContent = `On ${pf.name}, three taps`;
  if (card.brandIcons?.[key]) $("#brand").src = asset(card.brandIcons[key]); else $("#brand").style.display = "none";
  pf.steps.forEach(([icon, label, cls], i) => { const el = $("#s" + (i + 1)); el.innerHTML = ICON[icon]; el.className = cls; $("#l" + (i + 1)).textContent = label; });
  $("#l3").textContent = card.app;
  $("#item").src = asset(card.item.image); $("#name").textContent = card.item.name; $("#saved").textContent = card.savedLabel;
  $("#out-name").textContent = card.app; $("#url").textContent = card.url ?? "";
  if (card.badge) $("#badge").src = asset(card.badge); else $("#badge").parentElement.style.display = "none";
  if (card.ingredients) {
    const ing = card.ingredients, items = ing.items.slice(0, 8);
    $("#ing-title").textContent = ing.title ?? "Ingredients found";
    $("#count").textContent = `${ing.total ?? ing.items.length} items`;
    $("#grid").innerHTML = items.map((it) => `<div class="tile"><i><img src="${asset(it.icon)}" alt=""></i><b>${it.name}</b>${it.amount ? `<small>${it.amount}</small>` : ""}</div>`).join("");
  }
  await Promise.all([...document.images].filter((im) => im.src).map((im) => im.decode().catch(() => {})));
  await document.fonts.ready;
  if (card.ingredients) {
    // keep the card's bottom edge where it is, so it grows upward as the ingredients open
    const r = $("#card").getBoundingClientRect();
    $("#card").style.top = "auto"; $("#card").style.bottom = 1920 - r.bottom + "px";
    ingH = $("#ingin").getBoundingClientRect().height;
  }
  const base = $("#card").getBoundingClientRect();
  spots = ["#s1", "#s2", "#tile"].map((id) => { const r = $(id).getBoundingClientRect(); return { x: r.left + r.width / 2 - base.left, y: r.top + r.height / 2 - base.top }; });
  const lr = $("#logo").getBoundingClientRect(); logoAt = { x: lr.left + lr.width / 2, y: lr.top + lr.height / 2 };
  await seek(0);
  return end;
})();
</script>
</body>
</html>
